# ==============================================================================
# redis_replica.conf - [Plantilla Base: Rol 3 - Replica de Cache]
# ==============================================================================
bind 0.0.0.0
port 6379
protected-mode no
dir /data

# TODO [Rol 3]: Enlazar replicacion hacia el nodo primario
replicaof redis-master 6379
replica-read-only yes

# TODO [Rol 3]: Mantener mismos hilos fijos y persistencia AOF
io-threads 2
io-threads-do-reads yes
appendonly yes
appendfsync everysec
# replica-announce-ip redis-replica
