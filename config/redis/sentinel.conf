# ==============================================================================
# sentinel.conf - [Plantilla Base: Rol 3 - Quórum y Failover Automatico]
# ==============================================================================
port 26379
dir /data
protected-mode no

# TODO [Rol 3]: Habilitar resolucion de nombres Docker en Sentinel (Redis 7):
#   sentinel resolve-hostnames yes
#   sentinel announce-hostnames yes

# TODO [Rol 3]: Configurar monitoreo de 'mymaster' con quorum=2 (para 3 Sentinels)
# y tiempos rapidos de deteccion/promocion:
sentinel monitor mymaster redis-master 6379 2
sentinel down-after-milliseconds mymaster 2000
sentinel failover-timeout mymaster 5000
sentinel parallel-syncs mymaster 1
