# ==============================================================================
# redis_master.conf - [Plantilla Base: Rol 3 - Cache HA y Gestion de Memoria]
# ==============================================================================
bind 0.0.0.0
port 6379
protected-mode no
dir /data

# TODO [Rol 3 - Modulo I]: Configurar hilos fijos de E/S (--io-threads / io-threads)
# y comprobar en ps -L / top -H junto con los hilos bio_* del nucleo de Redis
io-threads 2
io-threads-do-reads yes

# TODO [Rol 3 - Modulo III]: Activar persistencia AOF en el volumen /data
appendonly yes
appendfsync everysec

# TODO [Rol 3 - Modulo II]: Ajustar maxmemory coherente con el cgroup (y documenta
# como se prueba memory.high / memory.max en el Experimento 5.3)
# maxmemory 384mb
# replica-announce-ip redis-maste
