# ==============================================================================
# nginx_lb.conf - [Plantilla Base: Rol 1 - Arquitecto de Entrada y Balanceo]
# ==============================================================================
# TODO [Rol 1]: Ajustar worker_processes segun las vCPUs y demostrar en Modulo I (ps -L)
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream app_backend {
        # TODO [Rol 1]: Elegir algoritmo (ej. least_conn) y configurar healthchecks pasivos:
        #   max_fails=1 fail_timeout=3s
        #   Agregar app-2 y app-3 segun el escalado (Exp. 5.2)
        server app-1:3000 max_fails=1 fail_timeout=3s;
    }

    server {
        listen 8080;
        server_name _;

        location /assets/ {
            # TODO [Rol 1]: Enrutar archivos estaticos hacia nginx-assets:8080
            proxy_pass http://nginx-assets:8080/assets/;
        }

        location / {
            proxy_pass http://app_backend;
            # TODO [Rol 1]: Configurar timeouts cortos y reintentos automaticos (proxy_next_upstream)
            # para garantizar 0 errores cuando caiga una replica de la App (Exp. 5.4):
            #   proxy_connect_timeout 500ms;
            #   proxy_next_upstream error timeout http_502 http_503 http_504;
            #   proxy_next_upstream_tries 3;
        }
    }
}
