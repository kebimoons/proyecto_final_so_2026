# ==============================================================================
# nginx_lb.conf - Rol 1 - Arquitecto de Entrada y Balanceo
# ==============================================================================
# stack_up.sh genera una copia en /tmp con worker_processes = nproc (vCPUs).
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    upstream app_backend {
        least_conn;
        # Lista de replicas (app-1 .. app-N) generada por stack_up.sh en /tmp.
        # Cada linea: server app-i:3000 max_fails=1 fail_timeout=3s;
        include /etc/nginx/upstream_app.conf;
    }

    server {
        listen 8080;
        server_name _;

        location /assets/ {
            proxy_pass http://nginx-assets:8080/assets/;
            proxy_connect_timeout 500ms;
        }

        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Timeouts cortos + reintento en otra replica => 0 errores si cae una app
            proxy_connect_timeout 500ms;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}