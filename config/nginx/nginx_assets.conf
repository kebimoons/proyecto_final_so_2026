# ==============================================================================
# nginx_assets.conf - Rol 1 - Servidor de Estaticos y Page Cache
# ==============================================================================
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # sendfile: el kernel copia del Page Cache al socket sin pasar por espacio de usuario.
    # tcp_nopush: envia cabeceras + inicio del archivo en el mismo paquete.
    sendfile on;
    tcp_nopush on;

    # Guarda descriptores/metadatos de archivos abiertos (menos syscalls open/stat).
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    access_log off;

    server {
        listen 8080;
        server_name _;

        location = /health {
            return 200 '{"status":"ok","service":"nginx-assets"}\n';
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}