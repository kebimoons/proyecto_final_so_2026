# ==============================================================================
# nginx_assets.conf - [Plantilla Base: Rol 1 - Servidor de Estaticos y Page Cache]
# ==============================================================================
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # TODO [Rol 1]: Verificar efecto de sendfile + tcp_nopush + open_file_cache
    # sobre la Page Cache del kernel (Modulo III: free -h, /proc/meminfo)
    sendfile on;
    tcp_nopush on;

    server {
        listen 8080;
        server_name _;

        location = /health {
            return 200 '{"status":"ok","service":"nginx-assets"}\n';
        }

        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            # TODO [Rol 1]: Configurar cabeceras de cache (expires / Cache-Control)
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
